<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e1a" />
  <title>Monopoly Party — Controller</title>
  <link rel="stylesheet" href="/controller.css" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('mp-theme') || 'light'</script>
</head>
<body>
  <div id="app"></div>
  <!-- The patch-managed layer: everything that must SURVIVE #app's wholesale
       innerHTML rebuilds (the three sheets) mounts here. A sibling, not a
       child — renderGame never touches it; updateChrome patches in place. -->
  <div id="chrome"></div>
  <script type="module" src="/controller.js"></script>
</body>
</html>
